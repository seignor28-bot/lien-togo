<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi de commande - Groupe Lien Togo</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f1f5f2; color: #222; }
  header { background: #166534; color: #fff; padding: 16px; text-align: center; }
  main { padding: 14px; max-width: 520px; margin: auto; }
  .carte { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  label { display: block; margin-bottom: 8px; font-weight: bold; }
  input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 8px; text-transform: uppercase; }
  button { width: 100%; margin-top: 12px; padding: 13px; font-size: 16px; border: 0; border-radius: 8px; background: #16a34a; color: #fff; }
  .ligne { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid #e5e7eb; padding: 10px 0; font-size: 15px; }
  .ligne:first-child { border-top: 0; }
  .erreur { color: #b91c1c; font-weight: bold; }
  a { color: #166534; }
</style>
</head>
<body>
<header>
  <strong>Groupe Lien Togo</strong><br>
  <small>Suivi de commande</small>
</header>
<main>
  <div class="carte">
    <label for="code">Ton code de commande</label>
    <input id="code" type="text" placeholder="Exemple : LT-ABC123" maxlength="30" autocomplete="off">
    <button id="voir">Voir ma commande</button>
  </div>
  <div class="carte" id="resultat" style="display:none"></div>
</main>

<script type="module">
import * as C from "./gt-config.js";
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

var SERVEUR = "https://script.google.com/macros/s/AKfycbxuJXFpRqRdMtiqXOiJir5caz419xH43k4nStrpDQPMvf2uU8vHtXpuK_am_7chRvrUTg/exec";
var champ = document.getElementById("code");
var zone = document.getElementById("resultat");

var db = null;
try {
  var cfg = C.firebaseConfig || C.config || C.default;
  var app = C.app || (getApps().length ? getApp() : initializeApp(cfg));
  db = C.db || getFirestore(app);
} catch (e) { db = null; }

function ligne(nom, valeur) {
  var d = document.createElement("div");
  d.className = "ligne";
  var a = document.createElement("span");
  a.textContent = nom;
  var b = document.createElement("strong");
  if (/^https:\/\//i.test(valeur)) {
    var lien = document.createElement("a");
    lien.href = valeur;
    lien.target = "_blank";
    lien.rel = "noopener";
    lien.textContent = "Voir la preuve";
    b.appendChild(lien);
  } else {
    b.textContent = valeur || "-";
  }
  d.appendChild(a);
  d.appendChild(b);
  return d;
}

function message(texte, erreur) {
  zone.style.display = "block";
  zone.textContent = "";
  var p = document.createElement("div");
  p.textContent = texte;
  if (erreur) p.className = "erreur";
  zone.appendChild(p);
}

async function voirFirestore(code) {
  var s = await getDoc(doc(db, "entreprises", "lien-togo", "suivis", code));
  if (!s.exists()) {
    message("Code introuvable.", true);
    return;
  }
  var d = s.data();
  zone.textContent = "";
  zone.appendChild(ligne("Code", code));
  zone.appendChild(ligne("Service", d.service));
  zone.appendChild(ligne("Statut", d.statut));
  zone.appendChild(ligne("Acompte", d.acompte));
  if (d.miseAJour && d.miseAJour.toDate) {
    zone.appendChild(ligne("Mis à jour le", d.miseAJour.toDate().toLocaleDateString("fr-FR")));
  }
}

async function voirFeuille(code) {
  var r = await fetch(SERVEUR + "?code=" + encodeURIComponent(code));
  var d = await r.json();
  if (!d.ok) {
    message(d.message || "Code introuvable.", true);
    return;
  }
  zone.textContent = "";
  zone.appendChild(ligne("Code", d.code));
  zone.appendChild(ligne("Service", d.service));
  zone.appendChild(ligne("Statut", d.statut));
  zone.appendChild(ligne("Acompte", d.acompte));
  zone.appendChild(ligne("Preuve", d.preuve));
}

async function voir() {
  var code = champ.value.trim().toUpperCase();
  if (code.length < 4) {
    message("Écris ton code de commande.", true);
    return;
  }
  message("Recherche en cours...", false);
  try {
    if (db && /^LT-[A-Z0-9]{6,12}$/.test(code)) {
      await voirFirestore(code);
    } else {
      await voirFeuille(code);
    }
  } catch (e) {
    message("Erreur de connexion. Réessaie.", true);
  }
}

document.getElementById("voir").onclick = voir;
champ.addEventListener("keydown", function (e) {
  if (e.key === "Enter") voir();
});
