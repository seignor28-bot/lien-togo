<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace gestion - Groupe Lien Togo</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f1f5f2; color: #222; }
  header { background: #166534; color: #fff; padding: 16px; text-align: center; }
  main { padding: 14px; max-width: 560px; margin: auto; }
  .carte { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  h2 { margin: 0 0 8px; font-size: 18px; }
  label { display: block; margin: 10px 0 6px; font-weight: bold; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 11px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; }
  textarea { min-height: 80px; }
  button { width: 100%; margin-top: 12px; padding: 12px; font-size: 16px; border: 0; border-radius: 8px; background: #16a34a; color: #fff; }
  button.gris { background: #64748b; }
  button:disabled { opacity: .6; }
  .ligne { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid #e5e7eb; padding: 8px 0; font-size: 15px; }
  .ligne:first-child { border-top: 0; }
  .ligne strong { text-align: right; word-break: break-word; }
  .cmd { border: 1px solid #d1d5db; border-radius: 10px; padding: 12px; margin-top: 12px; }
  .desc { background: #f8fafc; border-radius: 8px; padding: 10px; margin: 8px 0; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .erreur { color: #b91c1c; font-weight: bold; }
  .ok { color: #166534; font-weight: bold; }
  a { color: #166534; font-weight: bold; }
</style>
</head>
<body>
<header>
  <strong>Groupe Lien Togo</strong><br>
  <small>Espace gestion</small>
</header>
<main>
  <div class="carte" id="connexion">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username">
    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="current-password">
    <button id="entrer">Se connecter</button>
  </div>

  <div class="carte" id="espace" style="display:none">
    <div id="infos"></div>
    <button id="sortir" class="gris">Se déconnecter</button>
  </div>

  <div class="carte" id="commandes" style="display:none">
    <h2>Commandes</h2>
    <div id="liste">Chargement...</div>
    <button id="actualiser" class="gris">Actualiser</button>
  </div>

  <p id="msg"></p>
</main>

<script type="module">
import { auth, db, ENTREPRISE } from "./gt-config.js";
import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { doc, getDoc, collection, getDocs, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

var msg = document.getElementById("msg");
var connexion = document.getElementById("connexion");
var espace = document.getElementById("espace");
var infos = document.getElementById("infos");
var blocCommandes = document.getElementById("commandes");
var liste = document.getElementById("liste");

var STATUTS = {
  nouvelle: "Reçue",
  devis_envoye: "Devis envoyé",
  acompte_recu: "Acompte reçu",
  en_cours: "En cours",
  terminee: "Terminée",
  annulee: "Annulée"
};

function dire(texte, classe) {
  msg.textContent = texte;
  msg.className = classe || "";
}

function ligne(nom, valeur) {
  var d = document.createElement("div");
  d.className = "ligne";
  var a = document.createElement("span");
  a.textContent = nom;
  var b = document.createElement("strong");
  b.textContent = valeur;
  d.appendChild(a);
  d.appendChild(b);
  return d;
}

function ligneWhatsApp(tel) {
  var d = document.createElement("div");
  d.className = "ligne";
  var a = document.createElement("span");
  a.textContent = "WhatsApp";
  var b = document.createElement("strong");
  var chiffres = String(tel || "").replace(/[^0-9]/g, "");
  if (chiffres.length >= 8) {
    var lien = document.createElement("a");
    lien.href = "https://wa.me/" + chiffres;
    lien.target = "_blank";
    lien.rel = "noopener";
    lien.textContent = "Écrire au client";
    b.appendChild(lien);
  } else {
    b.textContent = "-";
  }
  d.appendChild(a);
  d.appendChild(b);
  return d;
}

async function entrer() {
  var email = document.getElementById("email").value.trim();
  var mdp = document.getElementById("mdp").value;
  if (!email || !mdp) {
    dire("Écris ton e-mail et ton mot de passe.", "erreur");
    return;
  }
  dire("Connexion en cours...", "");
  try {
    await signInWithEmailAndPassword(auth, email, mdp);
  } catch (e) {
    if (e.code === "auth/too-many-requests") {
      dire("Trop d'essais. Attends quelques minutes.", "erreur");
    } else {
      dire("E-mail ou mot de passe incorrect.", "erreur");
    }
  }
}

function carte(it) {
  var c = it.c;
  var bloc = document.createElement("div");
  bloc.className = "cmd";
  var date = c.creeLe && c.creeLe.toDate ? c.creeLe.toDate().toLocaleString("fr-FR") : "-";
  bloc.appendChild(ligne("Client", c.clientNom || c.clientEmail || "-"));
  bloc.appendChild(ligne("E-mail", c.clientEmail || "-"));
  bloc.appendChild(ligneWhatsApp(c.telephone));
  bloc.appendChild(ligne("Service", c.service || "-"));
  bloc.appendChild(ligne("Budget", c.budget || "-"));
  bloc.appendChild(ligne("Statut", STATUTS[c.statut] || String(c.statut || "-")));
  bloc.appendChild(ligne("Date", date));
  var desc = document.createElement("div");
  desc.className = "desc";
  desc.textContent = c.description || "";
  bloc.appendChild(desc);
  if (c.devisMontant) {
    bloc.appendChild(ligne("Devis", c.devisMontant));
  }

  var lm = document.createElement("label");
  lm.textContent = "Montant du devis";
  var im = document.createElement("input");
  im.type = "text";
  im.maxLength = 50;
  im.placeholder = "Exemple : 60 € ou 40 000 FCFA";
  im.value = c.devisMontant || "";
  var ld = document.createElement("label");
  ld.textContent = "Détail du devis";
  var td = document.createElement("textarea");
  td.maxLength = 1000;
  td.value = c.devisDetail || "";
  var bd = document.createElement("button");
  bd.textContent = "Enregistrer le devis (statut : Devis envoyé)";
  bd.onclick = async function () {
    var montant = im.value.trim();
    if (!montant) { dire("Écris le montant du devis.", "erreur"); return; }
    bd.disabled = true;
    try {
      await updateDoc(it.ref, {
        devisMontant: montant,
        devisDetail: td.value.trim(),
        statut: "devis_envoye",
        devisLe: serverTimestamp()
      });
      dire("Devis enregistré.", "ok");
      charger();
    } catch (e) {
      dire("Enregistrement impossible.", "erreur");
      bd.disabled = false;
    }
  };

  var ls = document.createElement("label");
  ls.textContent = "Changer le statut";
  var sel = document.createElement("select");
  Object.keys(STATUTS).forEach(function (k) {
    var o = document.createElement("option");
    o.value = k;
    o.textContent = STATUTS[k];
    if (k === c.statut) o.selected = true;
    sel.appendChild(o);
  });
  var bs = document.createElement("button");
  bs.className = "gris";
  bs.textContent = "Enregistrer le statut";
  bs.onclick = async function () {
    bs.disabled = true;
    try {
      await updateDoc(it.ref, { statut: sel.value });
      dire("Statut mis à jour.", "ok");
      charger();
    } catch (e) {
      dire("Mise à jour impossible.", "erreur");
      bs.disabled = false;
    }
  };

  bloc.appendChild(lm);
  bloc.appendChild(im);
  bloc.appendChild(ld);
  bloc.appendChild(td);
  bloc.appendChild(bd);
  bloc.appendChild(ls);
  bloc.appendChild(sel);
  bloc.appendChild(bs);
  return bloc;
}

async function charger() {
  liste.textContent = "Chargement...";
  try {
    var res = await getDocs(collection(db, "entreprises", ENTREPRISE, "commandes"));
    var items = [];
    res.forEach(function (d) { items.push({ id: d.id, ref: d.ref, c: d.data() }); });
    items.sort(function (a, b) {
      var x = a.c.creeLe && a.c.creeLe.toMillis ? a.c.creeLe.toMillis() : 0;
      var y = b.c.creeLe && b.c.creeLe.toMillis ? b.c.creeLe.toMillis() : 0;
      return y - x;
    });
    liste.textContent = "";
    if (items.length === 0) {
      liste.textContent = "Aucune commande pour le moment.";
      return;
    }
    items.forEach(function (it) { liste.appendChild(carte(it)); });
  } catch (e) {
    liste.textContent = "Impossible de charger les commandes.";
  }
}

onAuthStateChanged(auth, async function (user) {
  if (!user) {
    espace.style.display = "none";
    blocCommandes.style.display = "none";
    connexion.style.display = "block";
    return;
  }
  connexion.style.display = "none";
  espace.style.display = "block";
  infos.textContent = "";
  dire("Vérification de ton accès...", "");
  try {
    var membre = await getDoc(doc(db, "entreprises", ENTREPRISE, "membres", user.uid));
    if (!membre.exists()) {
      dire("Ce compte n'a pas accès à l'espace gestion.", "erreur");
      await signOut(auth);
      return;
    }
    var entreprise = await getDoc(doc(db, "entreprises", ENTREPRISE));
    var role = membre.data().role;
    var etiquette = role === "dg" ? "Directeur Général" : String(role);
    infos.appendChild(ligne("Compte", user.email));
    infos.appendChild(ligne("Entreprise", entreprise.exists() ? entreprise.data().nom : "-"));
    infos.appendChild(ligne("Rôle", etiquette));
    dire("", "");
    if (role === "dg") {
      blocCommandes.style.display = "block";
      charger();
    }
  } catch (e) {
    dire("Accès refusé par les règles de sécurité.", "erreur");
  }
});

document.getElementById("entrer").onclick = entrer;
document.getElementById("sortir").onclick = function () { signOut(auth); };
document.getElementById("actualiser").onclick = charger;
</script>
</body>
</html>
